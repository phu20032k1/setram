<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#12436a"/>
<title>Transport UI · Interactive Preview</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#171a1e;background:#f2f3f5}
*{box-sizing:border-box}
body{margin:0}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #efbb55}
#app{max-width:460px;margin:0 auto;background:#f4f5f6;min-height:100dvh;position:relative;box-shadow:0 0 30px #14243a20;overflow:hidden}
.top{background:linear-gradient(115deg,#00578a,#263151);color:white;min-height:78px;padding-top:6px;position:relative}
.page-title{height:72px;display:flex;align-items:center;justify-content:center;position:relative;font-size:22px;font-weight:600}
.icon-btn{position:absolute;right:10px;top:8px;background:transparent;color:inherit;border:0;font-size:29px;padding:4px 12px}
.back{left:8px;right:auto;font-size:37px;font-weight:300}
.nav{position:fixed;max-width:460px;width:100%;left:50%;transform:translateX(-50%);bottom:0;z-index:30;height:calc(70px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #d4d4d4;display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{width:20%;border:0;background:#fff;color:#a2a2a2;display:flex;gap:4px;align-items:center;justify-content:center;flex-direction:column;font-size:11px;white-space:nowrap}
.nav button.active{color:#263656}.nav svg{width:27px;height:27px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.nav button.active svg{stroke-width:2.7}
.content{padding-bottom:83px;min-height:calc(100dvh - 78px)}
.sample-chip{position:absolute;right:12px;top:122px;z-index:8;background:#ffe5b6;border:1px solid #d8842d;color:#703600;font-size:10px;font-weight:800;letter-spacing:.035em;padding:4px 9px;border-radius:20px}
.screen-white{background:#fff}.screen-gray{background:#f3f4f5}
.user{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:18px 15px;font-weight:700;font-size:18px;box-shadow:0 5px 15px #0000000a}
.swap{background:#fff;border:1.5px solid #006198;color:#006198;border-radius:8px;font-size:26px;width:44px;height:44px}
.empty-ticket{min-height:calc(100dvh - 247px);background:white;display:flex;flex-direction:column;align-items:stretch;justify-content:center;text-align:center;gap:24px;padding:20px 28px}
.empty-ticket h2{font-size:23px;color:#383838;margin:0}.empty-ticket p{font-size:18px;color:#3e3e3e;margin:0;line-height:1.45}
.buy{background:#005d95;border:0;border-radius:7px;padding:19px;color:white;font-size:18px;font-weight:600;margin-top:20px}
.scrim{position:fixed;inset:0;z-index:60;background:#0003;display:flex;justify-content:center;align-items:flex-end}
.sheet{width:min(100%,460px);padding:0 9px calc(13px + env(safe-area-inset-bottom));}
.sheet-item{display:block;width:100%;background:#f8f8f9;border:none;border-bottom:1px solid #d1d1d5;color:#1675ef;font-size:22px;padding:21px 5px}
.sheet-item:first-child{border-radius:16px 16px 0 0}.sheet-item:nth-child(2){border-radius:0 0 16px 16px;border-bottom:0}
.sheet-cancel{background:white;border:none;border-radius:15px;margin-top:9px;width:100%;color:#1675ef;font-size:23px;font-weight:600;padding:20px}
.modal{align-self:center;margin:16px;border-radius:18px;background:white;max-width:410px;width:100%;padding:25px;color:#25334d;box-shadow:0 20px 55px #0002}.modal h3{margin:0 0 10px;font-size:22px}.modal p{line-height:1.55;font-size:15px}.modal button{background:#005d95;color:white;border:0;border-radius:8px;padding:13px 20px;width:100%;margin-top:10px}
.history{background:#f2f3f5;min-height:calc(100dvh - 78px);padding-top:22px;padding-bottom:70px;position:relative}
.hist-group{margin:0 0 24px}.hist-date{background:#ededf1;color:#464646;font-size:19px;font-weight:650;padding:17px 22px}.hist-row{display:flex;align-items:center;gap:10px;background:#fff;min-height:56px;padding:13px 20px;font-size:15px}.hist-row .blue-ticket{font-size:27px;color:#005d95;line-height:1}.hist-row .prod{white-space:nowrap;flex:1}.hist-row .validated{white-space:nowrap;font-size:13px;text-align:right}.hist-row strong{font-size:15px}
.history-prototype-label{color:#66717b;font-size:11px;text-align:center;letter-spacing:.02em;padding:0 10px 15px}
.tab-head{display:flex;height:45px;background:linear-gradient(110deg,#00578a,#263151);color:#c5d0dc}
.tab-head button{width:33.33%;border:0;background:transparent;color:inherit;font-size:16px}.tab-head button.selected{border-bottom:4px solid white;color:white;font-weight:700}
.searchbox{margin:13px 9px;padding:11px 12px;border:1px solid #cbcbcb;border-radius:7px;background:#e9e9eb;display:flex;gap:10px}.searchbox input{background:transparent;border:0;outline:0;flex:1;min-width:0}
.line-list{padding:8px 9px}.line{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e9e9e9;border-radius:7px;margin:0 0 9px;padding:17px 8px;min-height:81px;text-align:left;width:100%;color:#161616}.line-badge{border-radius:50%;color:white;width:41px;height:41px;flex:0 0 41px;display:grid;place-items:center;font-size:20px;font-weight:800}.line-label{font-size:15px;line-height:1.5}.line-label small{display:block;color:#777;font-size:13px}
.traffic-toggle{display:flex;margin:9px;background:#dedee0;border-radius:10px;padding:3px}.traffic-toggle button{width:50%;border:0;background:transparent;border-radius:9px;padding:9px;font-size:17px}.traffic-toggle .sel{background:white;box-shadow:0 0 4px #0001;font-weight:600}
.traffic-caption{padding:22px 24px 10px;font-size:18px}.traffic-grid{margin:15px 10px;background:white;border-radius:10px;padding:12px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px 5px}.traffic-dot{width:41px;height:41px;color:white;border:0;border-radius:50%;font-size:19px;font-weight:800;position:relative;margin:auto}.traffic-dot:after{content:'i';position:absolute;right:-3px;bottom:-5px;background:#f07800;border-radius:50%;font-size:14px;padding:0;width:18px;height:18px;line-height:18px}
.menu-screen{min-height:calc(100dvh - 70px);background:linear-gradient(#fff 0 23%,#0a598a 23%,#243250 100%);padding:12px 17px 100px}
.brand{height:108px;text-align:center;display:flex;justify-content:center;align-items:center;color:#005a8e;font-size:34px;font-weight:800;font-style:italic;letter-spacing:-2px}.brand small{font-size:13px;letter-spacing:0;font-style:normal;font-weight:500;margin-left:12px}
.menu-card{border-radius:11px;overflow:hidden;background:white;box-shadow:0 8px 27px #0001}.menu-row{border:0;border-bottom:1px solid #c9c9c9;padding:19px 22px;width:100%;display:flex;align-items:center;gap:18px;text-align:left;background:white;color:#354150;font-size:17px;font-weight:600}.menu-row:last-child{border:0}.menu-row .symbol{font-size:24px;width:27px;text-align:center;color:#273657}.menu-row .chev{margin-left:auto;font-size:26px;font-weight:300}
.home-map{height:43dvh;min-height:310px;position:relative;overflow:hidden;background:#e7e9e3}.road{position:absolute;background:#fff;border:2px solid #d1d0c9;box-shadow:0 0 0 4px #f6f5ef}.road.a{width:160%;height:21px;top:55%;left:-30%;transform:rotate(30deg)}.road.b{width:160%;height:15px;top:35%;left:-20%;transform:rotate(-28deg)}.road.c{height:150%;width:17px;left:34%;top:-20%;transform:rotate(-24deg)}.road.d{height:150%;width:16px;left:74%;top:-20%;transform:rotate(16deg)}.map-label{position:absolute;color:#82827f;font-size:12px;font-weight:600}.loc-dot{position:absolute;top:48%;left:49%;width:21px;height:21px;background:#004b78;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px #777}.alert{position:absolute;top:15px;left:8%;right:8%;background:white;border-radius:12px;padding:15px;box-shadow:0 5px 30px #0002;display:flex;align-items:flex-start;gap:12px}.alert strong{font-size:17px}.alert p{margin:10px 0 0;font-size:13px;color:#555}.alert button{margin-left:auto;border:0;background:transparent;color:#888;font-size:23px}
.home-panel{background:linear-gradient(115deg,#005c91,#263452);color:white;border-radius:17px 17px 0 0;margin-top:-2px;position:relative;padding:16px 13px 30px}.route-search{display:block;background:#123954;border:0;border-radius:9px;padding:16px 14px;width:100%;text-align:left;color:#fff;font-size:17px}.home-logo{font-size:26px;font-weight:700;font-style:italic;margin:21px 0}.favorites{background:white;border-radius:9px;overflow:hidden;color:#324052}.favorite{padding:13px 14px;border:0;border-bottom:1px solid #ddd;background:white;width:100%;text-align:left;display:flex;gap:13px;align-items:center}.favorite:last-child{border:0}.fav-icon{background:#243453;color:white;border-radius:50%;height:34px;width:34px;display:grid;place-items:center}.favorite strong{font-size:15px}.favorite small{display:block;color:#666;font-size:12px;margin-top:3px}
@media(max-width:360px){.hist-row{padding:11px 9px;gap:6px}.hist-row .prod{font-size:13px}.hist-row .validated{font-size:11px}.hist-date{font-size:18px}.nav button{font-size:10px}}
@media(min-width:600px){#app{margin:18px auto;min-height:calc(100dvh - 36px);border-radius:20px;overflow:hidden}.nav{bottom:18px;border-radius:0 0 20px 20px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app"),page="home",overlay="",lineTab="Lines",trafficTab="Current",searchText="",alertShown=true;
var lines=[["T1","Antarès–Stade Marie Marvingt - Université","#e32636"],["T2","Espal-Arche de la Nature – Bellevue-Hauts de C.","#1674ac"],["T3","Allonnes–Bois Joli - Gares","#62b94c"],["C4","St-Joseph/St-Georges - Bellevue-Hauts de Coulaines","#11a3b7"],["5","Gazonfier - Oasis-Centre des Expositions","#ffcd04"],["6","République - St-Martin","#e50089"],["7","Éperon via Auchan","#ef891e"],["8","Service de bus","#bfce0a"],["11","Service de bus","#b67daa"],["16","Service de bus","#273580"]];
var validations=[["Tuesday 22 December 2026","11-25 ANS 30 jours","21:09"],["Tuesday 15 December 2026","11-25 ANS 30 jours","17:40"],["Saturday 12 December 2026","Ticket 24H","09:41"],["Sunday 22 November 2026","11-25 ANS 30 jours","21:09"],["Sunday 15 November 2026","11-25 ANS 30 jours","17:40"],["Thursday 12 November 2026","Ticket 24H","09:41"],["Thursday 22 October 2026","11-25 ANS 30 jours","21:09"],["Thursday 15 October 2026","11-25 ANS 30 jours","17:40"],["Monday 12 October 2026","Ticket 24H","09:41"]];
var icons={home:'<path d="m3 11 9-8 9 8v10h-7v-7h-4v7H3z"/>',timetables:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 3"/>',ticket:'<path d="M4 4h16v5a3 3 0 0 0 0 6v5H4v-5a3 3 0 0 0 0-6V4z" transform="rotate(-40 12 12)"/>',traffic:'<path d="M12 2 1 21h22L12 2z"/><path d="M12 9v5m0 4h.01"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>'};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function bar(title,back,more){return '<header class="top"><div class="page-title">'+(back?'<button aria-label="Back" class="icon-btn back" data-action="back">×</button>':'')+esc(title)+(more?'<button aria-label="Options" class="icon-btn" data-action="options">•••</button>':'')+'</div></header>'}
function nav(){var names=[["home","Home"],["timetables","Timetables"],["ticket","M-ticket"],["traffic","Service status"],["menu","Menu"]];return '<nav class="nav">'+names.map(function(item){return '<button data-action="'+item[0]+'" class="'+(page===item[0]?'active':'')+'"><svg viewBox="0 0 24 24">'+icons[item[0]]+'</svg>'+item[1]+'</button>'}).join("")+'</nav>'}
function home(){return '<div class="home-map"><div class="road a"></div><div class="road b"></div><div class="road c"></div><div class="road d"></div><div class="map-label" style="top:53%;left:16%">RUE BITCHE</div><div class="map-label" style="top:28%;left:65%">Garage Chaillou</div><div class="map-label" style="top:68%;left:28%">Croix Rouge Française</div><div class="loc-dot"></div>'+(alertShown?'<div class="alert"><span style="font-size:28px;color:#e87b00">⚠</span><div><strong>Manifestation</strong><p>En raison d’une manifestation, des perturbations sont actuellement en cours</p></div><button data-action="close-alert" aria-label="Close alert">×</button></div>':'')+'</div><div class="home-panel"><button class="route-search" data-action="route">⌕ &nbsp; Search for a route</button><div class="home-logo">Shall we go? &nbsp; SéTRAM</div><div class="favorites">'+[["⌂","Home","2 Impasse de Belfort, Le Mans (72000)"],["▣","Work","Université P+R, Le Mans (72000)"],["◷","David d’Angers","Le Mans"],["◷","Trintignant","Le Mans"]].map(function(r){return '<button class="favorite" data-action="route"><span class="fav-icon">'+r[0]+'</span><span><strong>'+r[1]+'</strong><small>'+r[2]+'</small></span></button>'}).join("")+'</div></div>'+nav()}
function timetable(){return bar("Timetables",false,false)+'<div class="tab-head">'+["Favorites","Lines","Stops"].map(function(t){return '<button data-action="line-tab" data-value="'+t+'" class="'+(lineTab===t?'selected':'')+'">'+t+'</button>'}).join("")+'</div><div class="content screen-gray"><div class="searchbox">⌕ <input id="search" aria-label="Search timetables" placeholder="Search" value="'+esc(searchText)+'"></div><div class="line-list">'+(lineTab==="Lines"?lines.filter(function(l){return l[0].toLowerCase().includes(searchText.toLowerCase())||l[1].toLowerCase().includes(searchText.toLowerCase())}).map(function(l){return '<button class="line" data-action="line" data-value="'+l[0]+'"><span class="line-badge" style="background:'+l[2]+'">'+l[0]+'</span><span class="line-label">'+esc(l[1])+'<small>Setram</small></span></button>'}).join(""):'<div style="color:#616161;padding:35px 12px;text-align:center">No saved '+lineTab.toLowerCase()+' in this preview.</div>')+'</div></div>'+nav()}
function ticket(){return bar("M-ticket",false,true)+'<div class="user"><span>Minh Phu Nguyen</span><button aria-label="Change account" class="swap" data-action="account">⇄</button></div><div class="empty-ticket"><h2>No ticket to use.</h2><p>You can buy tickets to travel on the network</p><button class="buy" data-action="buy">Buy tickets</button></div><span class="sample-chip">SAMPLE · NOT A VALID TICKET</span>'+nav()}
function history(){return bar("My validations",true,false)+'<div class="history">'+validations.map(function(v){return '<section class="hist-group"><div class="hist-date">'+v[0]+'</div><div class="hist-row"><span class="blue-ticket">◩</span><span class="prod">1 x '+v[1]+'</span><span class="validated">Validated at <strong>'+v[2]+'</strong></span></div></section>'}).join("")+'<div class="history-prototype-label">Prototype · données fictives</div></div>'}
function traffic(){var dots=[["5","#ffcc00"],["6","#e50083"],["8","#c5d500"],["10a","#f4511e"],["10b","#ed501a"],["11","#ac77ad"],["16","#283680"],["21","#a9d39b"],["25","#9ec3c0"],["28","#6951a5"],["32","#49122c"]];return bar("Traffic info",false,false)+'<div class="content screen-gray"><div class="traffic-toggle">'+["Current","To come"].map(function(t){return '<button data-action="traffic-tab" data-value="'+t+'" class="'+(trafficTab===t?"sel":"")+'">'+t+'</button>'}).join("")+'</div><div class="traffic-caption">'+(trafficTab==="Current"?"All the disrupted lines":"Upcoming service information")+'</div><div class="traffic-grid">'+dots.map(function(d){return '<button class="traffic-dot" style="background:'+d[1]+'" data-action="line" data-value="'+d[0]+'">'+d[0]+'</button>'}).join("")+'</div></div><span class="sample-chip">SAMPLE · NOT LIVE STATUS</span>'+nav()}
function menu(){return '<div class="menu-screen"><div class="brand">SéTRAM <small>LE MANS<br>Métropole</small></div><div class="menu-card">'+[["◉","Minh Phu Nguyen"],["♥","Favorites"],["▱","My Documents"],["▣","Network maps"],["↗","Useful links"],["✉","Contact us"],["♢","Privacy policy"],["⚙","Settings"]].map(function(m){return '<button class="menu-row" data-action="menu-item" data-value="'+esc(m[1])+'"><span class="symbol">'+m[0]+'</span>'+esc(m[1])+'<span class="chev">›</span></button>'}).join("")+'</div></div>'+nav()}
function modal(title,body){overlay='<div class="scrim" data-action="overlay"><div class="modal" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p><button data-action="dismiss">Close</button></div></div>';render()}
function render(){var view=page==="home"?home():page==="timetables"?timetable():page==="ticket"?ticket():page==="history"?history():page==="traffic"?traffic():menu();app.innerHTML=view+overlay}
app.addEventListener("click",function(e){var b=e.target.closest("[data-action]");if(!b)return;var a=b.getAttribute("data-action"),v=b.getAttribute("data-value");if(a==="options"){overlay='<div class="scrim"><div class="sheet"><button class="sheet-item" data-action="history">My validations</button><button class="sheet-item" data-action="help">How to use your tickets?</button><button class="sheet-cancel" data-action="dismiss">Cancel</button></div></div>';render();return}if(a==="history"){page="history";overlay=""}else if(a==="back"){page="ticket";overlay=""}else if(["home","timetables","ticket","traffic","menu"].indexOf(a)!==-1){page=a;overlay=""}else if(a==="dismiss"){overlay=""}else if(a==="close-alert"){alertShown=false}else if(a==="line-tab"){lineTab=v;searchText=""}else if(a==="traffic-tab"){trafficTab=v}else if(a==="buy"){modal("Preview only","This is an independent UI prototype. It cannot sell or validate transport tickets. Use the official app to buy a real ticket.");return}else if(a==="help"){modal("Using tickets","The real network requires official ticket purchase and validation. This page is an independent mockup.");return}else if(a==="route"){modal("Search for a route","Route search is a design preview, not a live journey planner.");return}else if(a==="line"){modal("Line "+v,"Schedules and incidents shown here are examples only and are not live.");return}else if(a==="menu-item"||a==="account"){modal(v||"Account","This section is a non-functional design preview.");return}render()});
app.addEventListener("input",function(e){if(e.target.id==="search"){searchText=e.target.value;var pos=e.target.selectionStart;render();var input=document.getElementById("search");if(input){input.focus();input.setSelectionRange(pos,pos)}}});
render();
})();
</script>
</body>
</html>
